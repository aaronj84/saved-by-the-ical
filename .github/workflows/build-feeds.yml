name: Build feeds and site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: sbtical check data/schools/*.yaml data/people/*.yaml data/carpool.yaml
      - run: sbtical build data/schools/*.yaml data/people/*.yaml data/carpool.yaml
      - run: sbtical readme data/schools/*.yaml data/people/*.yaml data/carpool.yaml
      - name: Fail PRs whose committed feeds are stale
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- feeds README.md
      - name: Commit regenerated feeds
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add feeds README.md
          if ! git diff --cached --quiet; then git commit -m "Rebuild feeds" && git push; fi
      - run: sbtical site data/schools/*.yaml data/people/*.yaml data/carpool.yaml -o _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# FICTIONAL example — a template for real schools. Times are local to school.timezone.
# Quote times ("08:00") to avoid YAML number parsing surprises.
school:
  id: example-high
  name: Example High School
  timezone: America/Los_Angeles

year:
  first_day: 2026-08-19
  last_day: 2027-06-10

bell_schedules:
  regular:
    name: Regular Schedule
    periods:
      - { id: "1", name: Period 1, start: "08:00", end: "08:55" }
      - { id: "2", name: Period 2, start: "09:01", end: "09:56" }
      - { id: brunch, name: Brunch, start: "09:56", end: "10:06", kind: break }
      - { id: "3", name: Period 3, start: "10:12", end: "11:07" }
      - { id: "4", name: Period 4, start: "11:13", end: "12:08" }
      - { id: lunch, name: Lunch, start: "12:08", end: "12:43", kind: break }
      - { id: "5", name: Period 5, start: "12:49", end: "13:44" }
      - { id: "6", name: Period 6, start: "13:50", end: "14:45" }
  late_start:
    name: Late Start
    periods:
      - { id: "1", name: Period 1, start: "09:30", end: "10:15" }
      - { id: "2", name: Period 2, start: "10:21", end: "11:06" }
      - { id: "3", name: Period 3, start: "11:12", end: "11:57" }
      - { id: lunch, name: Lunch, start: "11:57", end: "12:32", kind: break }
      - { id: "4", name: Period 4, start: "12:38", end: "13:23" }
      - { id: "5", name: Period 5, start: "13:29", end: "14:14" }
      - { id: "6", name: Period 6, start: "14:20", end: "15:05" }
  minimum:
    name: Minimum Day
    periods:
      - { id: "1", name: Period 1, start: "08:00", end: "08:35" }
      - { id: "2", name: Period 2, start: "08:41", end: "09:16" }
      - { id: "3", name: Period 3, start: "09:22", end: "09:57" }
      - { id: "4", name: Period 4, start: "10:03", end: "10:38" }
      - { id: "5", name: Period 5, start: "10:44", end: "11:19" }
      - { id: "6", name: Period 6, start: "11:25", end: "12:00" }

# Default schedule by weekday; omitted days have no school.
weekly:
  mon: regular
  tue: regular
  wed: late_start
  thu: regular
  fri: regular

# Optional A/B (or 1-6, etc.) rotation. Advances one label per school day.
rotation:
  labels: [A, B]
  start: 2026-08-19

# Date overrides, applied in order (later entries win).
days:
  - { date: 2026-09-07, no_school: true, title: Labor Day }
  - { date: 2026-10-09, no_school: true, title: Staff Development Day (no students) }
  - { date: 2026-11-11, no_school: true, title: Veterans Day }
  - { start: 2026-11-23, end: 2026-11-27, no_school: true, title: Thanksgiving Break }
  - { start: 2026-12-21, end: 2027-01-01, no_school: true, title: Winter Break }
  - { date: 2026-12-18, schedule: minimum, title: Minimum Day — Finals }
  - { date: 2027-01-18, no_school: true, title: MLK Jr. Day }
  - { start: 2027-03-29, end: 2027-04-02, no_school: true, title: Spring Break }
  - { date: 2027-04-14, schedule: regular, title: "Regular schedule (testing week, no late start)" }
  - { date: 2027-05-31, no_school: true, title: Memorial Day }
  - { date: 2027-06-10, schedule: minimum, title: Last Day of School }

events:
  - title: Back to School Night
    date: 2026-09-10
    start_time: "18:00"
    end_time: "20:00"
    location: Main Gym
    categories: [family]
  - { title: Homecoming Game, date: 2026-10-16, start_time: "19:00", end_time: "21:30", location: Stadium, categories: [athletics] }
  - { title: Picture Day, date: 2026-09-15, categories: [student-life] }
  - { title: Parent-Teacher Conferences, start: 2026-11-04, end: 2026-11-05, categories: [family] }

# Each feed becomes <school.id>/<feed.id>.ics
#   include: bells | day_labels | days | events
feeds:
  - { id: everything, name: Everything, include: [day_labels, days, events, bells] }
  - { id: bells, name: Bell Schedule, include: [bells] }
  - { id: bells-with-breaks, name: Bell Schedule (with lunch & brunch), include: [bells], include_breaks: true }
  - { id: day-types, name: A/B Days & Schedule Changes, include: [day_labels] }
  - { id: important-dates, name: Holidays & Schedule Changes, include: [days] }
  - { id: no-school, name: No School Days, include: [days], no_school_only: true }
  - { id: events, name: Events, include: [events] }
  - { id: athletics, name: Athletics, include: [events], categories: [athletics] }

# Per-person feeds: bell periods relabeled with that person's classes.
# A period can map to one class, or differ by rotation label.
students:
  - id: student-demo
    name: Demo Student
    include: [bells, days]
    classes:
      "1": { title: Algebra II, location: Room 112, teacher: Ms. Rivera }
      "2": { A: { title: Chemistry, location: Lab 3 }, B: { title: PE, location: Gym } }
      "3": English 10
      "5": { title: US History, location: Room 204 }

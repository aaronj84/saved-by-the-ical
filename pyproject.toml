[project]
name = "sbtical"
version = "0.1.0"
description = "Store detailed school calendar data and publish it as iCal subscription feeds"
requires-python = ">=3.11"
dependencies = ["icalendar>=6.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sbtical = "sbtical.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

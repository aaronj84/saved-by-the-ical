# Columns for the site's "Daily schedule → Schools" view, left to right.
#   school: show that school's bell schedule (group tracks like lunch groups or
#           grades are narrowed to the groups the kids are in)
#   feeds:  show only the periods in these feeds (school/feed), e.g. the
#           Jordan/CTEC periods one kid actually attends
#   carpool: true for the carpool pickups (data/carpool.yaml)
#   prefix: text before each period name ("Jordan P1"); feed titles already
#           carry their school's short name
columns:
  - { title: Butler Elem, school: butler-elementary, prefix: Elem }
  - { title: Butler Mid, school: butler, prefix: Butler }
  - { title: Carpool, carpool: true }
  - { title: Jordan / CTEC, feeds: [jordan/mornings, ctec/am-b-days], label_from: jordan }
  - { title: Brighton, school: brighton, prefix: BHS }

# Main calendars to subscribe to, in this order (paths under feeds/, no .ics).
# Shown first on the site and in the README; everything else is listed under
# "More calendars".
subscribe:
  - carpool/all
  - people/class-schedule-f
  - brighton/calendar
  - butler/calendar
  - butler-elementary/calendar
  - brighton/class-schedule-s
  - brighton/class-schedule-l
  - butler/class-schedule-d
  - butler/class-schedule-r
  - butler-elementary/class-schedule-m
  - butler-elementary/class-schedule-b

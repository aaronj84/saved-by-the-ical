# Carpool pickups. Each rule follows its school's calendar (no pickups on days
# off) and can be limited to weekdays and/or A/B rotation days.
#   kids: initials, matching the "Class Schedule X" feeds
#   driver: optional; drivers get their own feed below
#   minutes: how long the pickup block lasts (default 10)
carpool:
  # Mornings: picked up from home
  - { title: "Carpool to Butler Mid", short: Mid AM, school: schools/butler.yaml,
      kids: [D, R], time: "07:20", rotation: [A] }
  - { title: "Carpool to Butler Mid (Maker's Club)", short: "Mid AM · Maker's", school: schools/butler.yaml,
      kids: [D, R], time: "07:00", rotation: [B] }
  - { title: "Carpool to Butler Elem", short: Elem AM, school: schools/butler-elementary.yaml,
      kids: [B, M], time: "07:45", days: [mon, thu] }
  - { title: "Carpool to Butler Elem", short: Elem AM, school: schools/butler-elementary.yaml,
      kids: [B, M], time: "08:00", days: [tue, wed, fri] }

  # Afternoons: Jenn Mon/Tue and Fri, Aaron Wed/Thu
  - { title: "Pickup at Butler Elem", short: Elem PM, school: schools/butler-elementary.yaml,
      kids: [B, M], time: "15:15", days: [mon, tue], driver: Jenn }
  - { title: "Pickup at Butler Mid", short: Mid PM, school: schools/butler.yaml,
      kids: [D, R], time: "15:25", days: [mon, tue], driver: Jenn }
  - { title: "Pickup at Butler Elem", short: Elem PM, school: schools/butler-elementary.yaml,
      kids: [B, M], time: "13:25", days: [fri], driver: Jenn }
  - { title: "Pickup at Butler Mid", short: Mid PM, school: schools/butler.yaml,
      kids: [D, R], time: "13:35", days: [fri], driver: Jenn }
  - { title: "Pickup at Butler Elem", short: Elem PM, school: schools/butler-elementary.yaml,
      kids: [B, M], time: "15:15", days: [wed, thu], driver: Aaron }
  - { title: "Pickup at Butler Mid", short: Mid PM, school: schools/butler.yaml,
      kids: [D, R], time: "15:25", days: [wed, thu], driver: Aaron }

feeds:
  - { id: all, name: Carpool, description: "All carpool pickups for the Butler kids." }
  - { id: jenn, name: Jenn's Pickups, driver: Jenn, description: "Afternoon pickups Jenn drives." }
  - { id: aaron, name: Aaron's Pickups, driver: Aaron, description: "Afternoon pickups Aaron drives." }
